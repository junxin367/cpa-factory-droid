name: 构建与发布

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的发布标签，例如 v0.1.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"
  CPA_PLUGIN_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}

jobs:
  metadata:
    name: 校验发布版本
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: 校验标签、版本和注册表
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/release.mjs registry
          node scripts/release.mjs verify-manifest
          node scripts/release.mjs metadata

  build:
    name: 构建 ${{ matrix.platform }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
          - platform: linux-amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
          - platform: darwin-amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: 检查 Rust 工具链
        run: rustup show active-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: 检查 Rust 格式
        run: cargo fmt --check
      - name: 运行 Rust 测试
        run: cargo test --locked
      - name: 检查前端脚本语法
        run: |
          node --check web/app.js
          node --check web/manager-extension.js
      - name: 构建与打包
        shell: pwsh
        run: ./scripts/build.ps1 -Target '${{ matrix.target }}' -ReleaseAssets
      - name: 验证 Linux GLIBC 兼容基线
        if: matrix.goos == 'linux'
        run: node scripts/check-linux-runtime.mjs target/${{ matrix.target }}/release/libcpa_factory_droid.so 2.35
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: 真实 CPA 宿主集成验证
        shell: pwsh
        run: |
          $library = switch ('${{ matrix.goos }}') {
            'windows' { 'cpa_factory_droid.dll' }
            'linux' { 'libcpa_factory_droid.so' }
            'darwin' { 'libcpa_factory_droid.dylib' }
          }
          python -B scripts/verify-cpa.py --library "target/${{ matrix.target }}/release/$library" --host-version 8.0.52 --report "temp/cpa-validation-${{ matrix.platform }}-8.0.52.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-droid-${{ matrix.platform }}
          path: release/factory-droid_${{ needs.metadata.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-${{ matrix.platform }}
          path: temp/cpa-validation-*.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: 发布完整安装包
    needs: [metadata, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: factory-droid-*
          path: artifacts
          merge-multiple: true
      - name: 检查产物与生成发布说明
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p temp
          node scripts/release.mjs checksums artifacts "$VERSION"
          node scripts/release.mjs notes "$RELEASE_TAG" > temp/release-notes.md
      - name: 创建或补全 GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file temp/release-notes.md
          else
            flags=()
            if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file temp/release-notes.md "${flags[@]}"
          fi
      - name: 生成 CPA 更新清单
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets,body,tagName,url > temp/release.json
          node scripts/release.mjs manifest temp/release.json artifacts/latest.json
          gh release upload "$RELEASE_TAG" artifacts/latest.json --clobber
      - name: 核对完整发布资产并公开版本
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets,body,tagName,url > temp/final-release.json
          node scripts/release.mjs manifest temp/final-release.json temp/verified-latest.json
          cmp artifacts/latest.json temp/verified-latest.json
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fx latest.json
          gh release edit "$RELEASE_TAG" --draft=false
