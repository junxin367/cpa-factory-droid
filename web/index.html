<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Factory Droid · 凭证接入</title>
  <link rel="stylesheet" href="/v0/resource/plugins/factory-droid/style.css">
  <script src="/v0/resource/plugins/factory-droid/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <main id="main" class="app">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">F</span><div><h1>Factory Droid</h1><span id="version" class="muted">CPA 凭证接入</span></div></div>
      <button id="authorize" type="button" class="secondary">连接管理端</button>
    </header>
    <section class="connection-bar" aria-label="接入状态">
      <span id="connection-status" role="status">尚未连接</span>
      <span id="native-quota-status" class="muted" role="status" hidden>原生额度已启用</span>
      <a id="manage-credentials" target="_top" href="/management.html#/auth-files">管理凭证 ↗</a>
    </section>
    <section id="auto-enhancement" class="connection-bar" hidden aria-label="自动增强">
      <label><input id="auto-enhancement-toggle" type="checkbox"> 自动加载额度增强</label>
      <span id="auto-enhancement-status" class="muted" role="status"></span>
    </section>
    <section class="panel" aria-labelledby="add-title">
      <h2 id="add-title">添加 Factory 凭证</h2>
      <p><a id="oauth-login" target="_top" href="/management.html#/oauth">使用 Factory OAuth 登录 →</a></p>
      <form id="account-form">
        <fieldset id="account-fields" disabled>
          <label for="account-label">名称</label>
          <input id="account-label" name="label" maxlength="80" autocomplete="off" placeholder="例如：Factory Pro" required>
          <label for="account-key">Factory API Key</label>
          <div class="secret-field">
            <input id="account-key" name="api_key" type="password" maxlength="4096" autocomplete="off" spellcheck="false" placeholder="fk-…" required>
            <button id="show-key" type="button" class="quiet" aria-label="显示 Factory API Key" aria-pressed="false">显示</button>
          </div>
          <button id="add-account" type="submit" class="primary">添加凭证</button>
        </fieldset>
        <p id="account-error" class="error" role="alert" hidden></p>
        <div id="account-success" class="success" role="status" hidden><span id="success-message"></span><a id="success-link" target="_top" href="/management.html#/auth-files">打开凭证管理 →</a></div>
      </form>
    </section>
  </main>
  <dialog id="auth-dialog" aria-labelledby="auth-title">
    <form id="auth-form">
      <div class="dialog-heading"><h2 id="auth-title">连接管理端</h2><button type="button" id="close-auth" class="quiet" aria-label="关闭管理授权">×</button></div>
      <label for="management-key">当前管理器密钥</label>
      <input id="management-key" type="password" maxlength="4096" autocomplete="off" required>
      <p id="auth-error" class="error" role="alert" hidden></p>
      <footer><button id="disconnect" type="button" class="secondary" hidden>断开连接</button><button id="connect" class="primary" type="submit">连接</button></footer>
    </form>
  </dialog>
</body>
</html>
